name: Compilar ejecutables para Windows

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller openpyxl selenium webdriver-manager

    - name: Crear ejecutables .EXE
      run: |
        pyinstaller --onefile --collect-submodules selenium script_tandil.py
        pyinstaller --onefile --collect-submodules selenium script_retributiva.py

    - name: Guardar ejecutables como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Ejecutables-Tandil
        path: dist/*.exe
